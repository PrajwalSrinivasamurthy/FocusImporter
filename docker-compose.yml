services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focus-importer
    ports:
      - "3007:3000"
    env_file:
      - .env.local
    volumes:
      - logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped

  healthcheck:
    image: node:20-alpine
    container_name: focus-importer-healthcheck
    env_file:
      - .env.local
    environment:
      # Overrides the .env.local value so the monitor reaches the app over
      # the docker-compose network rather than localhost.
      HEALTH_CHECK_URL: http://app:3000/focusimporter/api/health
    volumes:
      - ./scripts/health-check-cron.js:/health-check-cron.js:ro
    command: ["node", "/health-check-cron.js"]
    depends_on:
      - app
    restart: unless-stopped

volumes:
  logs:
